<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Splash, loading</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
@keyframes slide{0%{left:-35%}100%{left:100%}}
</style>
</helmet>
<div style="width: 720px; height: 405px; box-sizing: border-box; position: relative; border-radius: 8px; overflow: hidden; border: 1px solid #3d3d3d; background: #000000; color: #ffffff">
  <img src="/_blob/c2ad57e65d0ed410909607e175e5ec27" alt="Marvel Champions: The Card Game box art" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 24px 20px; background: rgba(0, 0, 0, 0.82); display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
      <span style="font-size: 20px; font-weight: 600">Champions Companion</span>
      <span style="font-size: 12px; color: #c5c5c5">Version 1.0 · Phase 2</span>
    </div>
    <div style="font-size: 13px; color: #d6d6d6" role="status">Loading cards…</div>
    <div style="position: relative; height: 4px; border-radius: 2px; background: #3a3a3a; overflow: hidden" role="progressbar" aria-label="Loading">
      <div style="position: absolute; top: 0; left: 0; width: 35%; height: 4px; border-radius: 2px; background: #60cdff; animation: slide 1.6s ease-in-out infinite"></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":405}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
